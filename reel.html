<script>

let SCAN, VIG, NOISE;

}
function buildStatics() {

  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');

function panel(c, x, y, w, h, a = 1, accent = C.lime) {

  c.strokeStyle = 'rgba(255,255,255,0.14)'; c.lineWidth = 1.5; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  c.strokeStyle = accent; c.lineWidth = 3; const L = 16;

  c.moveTo(x + w - L, y + h); c.lineTo(x + w, y + h); c.lineTo(x + w, y + h - L); c.stroke();

}
function brackets(c, x, y, w, h, L, col, lw = 3, a = 1) {
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a; c.strokeStyle = col; c.lineWidth = lw; c.beginPath();

function line(c, x0, y0, x1, y1) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
function polyline(c, pts, p) {

function check(c, x, y, s, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = s * 0.15; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - s * 0.36, y + s * 0.02); c.lineTo(x - s * 0.1, y + s * 0.28); c.lineTo(x + s * 0.4, y - s * 0.3); c.stroke(); c.restore();
}
function cross(c, x, y, s, col) {

  line(c, x - s * 0.3, y - s * 0.3, x + s * 0.3, y + s * 0.3); line(c, x + s * 0.3, y - s * 0.3, x - s * 0.3, y + s * 0.3); c.restore();
}
// Club crest inside a HUD coin; `tilt` fakes a 3D wobble by squashing horizontally.
function crest(c, key, x, y, size, a = 1, tilt = 0, ring = true, ringCol = C.lime) {
  const im = LG[key]; if (!im || a <= 0) return;

    c.beginPath(); c.arc(0, 0, size * 0.62, 0, Math.PI * 2);

// Isometric data column, stacked like the channel's 3D stat towers.
function isoBar(c, x, base, w, h, pal, glow) {

}
const PAL_LIME = ['#dcff63', '#6f8c12', '#f3ffc2'];
const PAL_GOLD = ['#ffd975', '#8a5c10', '#fff1c0'];
const PAL_WHITE = ['#ffffff', '#8a8f96', '#ffffff'];
function counter(c, val, p, x, y, size, col, glow) {
  font(c, size, F.num, 700, -2);
  const v = Math.round(val * eoExpo(clamp(p)));
  c.save(); c.fillStyle = col; if (glow) { c.shadowColor = glow; c.shadowBlur = 44; }
  c.fillText(String(v), x, y); c.restore();

}
function rays(c, x, y, t, a, col = '255,214,110') {
  if (a <= 0) return;
  c.save(); c.translate(x, y); c.rotate(t * 0.15);

    c.rotate(Math.PI * 2 / 14);
    const g = c.createLinearGradient(0, 0, 0, -760);
    g.addColorStop(0, `rgba(${col},${0.2 * a})`); g.addColorStop(1, `rgba(${col},0)`);

// Golden ball: wireframe hologram that solidifies into gold.
function ballonDor(c, x, y, R, rot, solid, wire, a = 1, base = true) {

  glow.addColorStop(0, `rgba(255,205,100,${0.42 * Math.max(solid, 0.4)})`); glow.addColorStop(1, 'rgba(255,205,100,0)');
  c.fillStyle = glow; c.fillRect(-R * 2.3, -R * 2.3, R * 4.6, R * 4.6);

    font(c, Math.max(8, R * 0.095), F.mono, 700, 2); c.fillStyle = '#e9c36a'; c.textAlign = 'center'; c.textBaseline = 'middle';

    c.globalAlpha = A * solid;

// Real Ballon d'Or cut-out (photo). `reveal` scans it in from the base up; `sweep` runs a light glint across.
function realTrophy(cx, cy, h, a, reveal, sweep, t, holo = false) {
  const im = LG['ballon-dor-real']; if (!im || a <= 0 || reveal <= 0) return;

  const s = Math.min(1, (ph - 40) / h, (pw - 40) / w), dw = w * s, dh = h * s, ox = (pw - dw) / 2, oy = (ph - dh) / 2;

// Perspective pitch drawn on a ground plane (outro backdrop).
function pitch3D(c, t, a, col = '200,240,60') {

  const show = t => { cur = t; render(t); scrub.value = t; tc.textContent = t.toFixed(2).padStart(5, '0'); };
  const loop = () => { if (!playing) return; let t = startT + (performance.now() - startWall) / 1000; if (t >= DUR) t = 0, startT = 0, startWall = performance.now(); show(t); requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; if (playing) { startT = cur; startWall = performance.now(); loop(); } };
  scrub.oninput = () => { playing = false; btn.textContent = 'Play'; show(+scrub.value); };
  ready.then(() => show(0));
}
</script>
</body>
